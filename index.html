    <script>
      var SB_URL="https://jjitptktlzpyalwhvujv.supabase.co";
      var SB_KEY="sb_publishable_th-SXFYO8VwZNMFhzSrIAQ__PG8liIC";
      var sbClient=null;
      function initSupabase(){
        try{
          sbClient=window.supabase.createClient(SB_URL,SB_KEY);
          window.sbReady=true;
          window.dispatchEvent(new Event("sbready"));
        }catch(e){console.error("Supabase init failed:",e)}
      }
      window.sbSaveRoute=async function(name,payload){
        var u=(await sbClient.auth.getUser()).data.user;
        if(!u)throw new Error("Not signed in");
        var res=await sbClient.from("routes").insert([{name:name,data:JSON.stringify(payload),created_by:u.id,created_by_email:u.email}]).select();
        if(res.error)throw res.error;
        return res.data[0].id;
      };
      window.sbListRoutes=async function(){
        var res=await sbClient.from("routes").select("id,name,created_at,created_by_email").order("created_at",{ascending:false});
        if(res.error)throw res.error;
        return res.data;
      };
      window.sbLoadRoute=async function(id){
        var res=await sbClient.from("routes").select("data").eq("id",id).single();
        if(res.error)throw res.error;
        return JSON.parse(res.data.data);
      };
      window.sbDeleteRoute=async function(id){
        var res=await sbClient.from("routes").delete().eq("id",id);
        if(res.error)throw res.error;
      };
      window.sbSignIn=async function(email,password){
        var res=await sbClient.auth.signInWithPassword({email:email,password:password});
        if(res.error)throw res.error;
        return res.data.user;
      };
      window.sbSignOut=async function(){await sbClient.auth.signOut()};
      window.sbCurrentUser=async function(){
        if(!sbClient)return null;
        var res=await sbClient.auth.getUser();
        return res.data.user;
      };
    </script>

var APP_VERSION="v1.2.0";
var APP_BUILD="2026-07-15";
document.addEventListener("DOMContentLoaded",function(){
    document.getElementById("verBadge").textContent=APP_VERSION;
    document.getElementById("verLogin").textContent=APP_VERSION+" ("+APP_BUILD+")";
});
console.log("413 Route Planner "+APP_VERSION+" build "+APP_BUILD);
// ============================================================
// MOBILE PANEL / LEGEND TOGGLES
// ============================================================
var isMobile=window.matchMedia("(max-width:760px)").matches;
var panelEl=document.getElementById("panel");
var legendPanel=document.getElementById("legend");
document.getElementById("panelToggle").addEventListener("click",function(){
    var vis=panelEl.style.display!=="none"&&!panelEl.classList.contains("collapsed");
    if(vis){panelEl.style.display="none"}
    else{panelEl.style.display="block";panelEl.classList.remove("collapsed");legendPanel.classList.remove("shown")}
});
document.getElementById("legendToggle").addEventListener("click",function(){
    var shown=legendPanel.classList.contains("shown");
    if(shown){legendPanel.classList.remove("shown")}
    else{legendPanel.classList.add("shown");panelEl.style.display="none"}
});
document.getElementById("panelClose").addEventListener("click",function(){panelEl.style.display="none"});
document.getElementById("legendClose").addEventListener("click",function(){legendPanel.classList.remove("shown")});
function showLegend(){
    // On desktop, reveal legend; on mobile, leave it to the toggle button (just ensure it can show)
    if(window.matchMedia("(max-width:760px)").matches){legendPanel.style.display=""}
    else{legendPanel.style.display="block"}
}


if(window.supabase)initSupabase();

// ============================================================
// AUTH GATE
// ============================================================
var authedUser=null;
function showLogin(){document.getElementById("loginOverlay").style.display="flex"}
function hideLogin(){document.getElementById("loginOverlay").style.display="none"}

function onSignedIn(user){
    authedUser=user;
    hideLogin();
    var badge=document.getElementById("userBadge");
    badge.textContent=user.email+" (sign out)";
    if(typeof refreshCloudList==="function")refreshCloudList();
}

document.getElementById("loginBtn").addEventListener("click",function(){
    var email=document.getElementById("loginEmail").value.trim();
    var pass=document.getElementById("loginPass").value;
    var errEl=document.getElementById("loginErr");
    errEl.style.display="none";

function ft(m){var h=Math.floor(m/60),mn=Math.round(m%60),ap=h<12?"AM":"PM";var h12=h<=12?h:h-12;if(h12===0)h12=12;return h12+":"+(mn<10?"0":"")+mn+" "+ap}

function nextMonday(d){var dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()+((8-dt.getDay())%7||7));return dt.toISOString().slice(0,10)}

function osrmLegs(points,callback){
    var allLegs=[];if(points.length<2){callback(allLegs);return}
    var bs=80,batches=[];
    for(var i=0;i<points.length;i+=bs-1){var end=Math.min(i+bs,points.length);batches.push(points.slice(i,end));if(end>=points.length)break}
    var bi=0;
    function nb(){
        if(bi>=batches.length){callback(allLegs);return}
        var batch=batches[bi];var c=batch.map(function(p){return p[0]+","+p[1]}).join(";");
        statusEl.textContent="OSRM drive times... batch "+(bi+1)+"/"+batches.length;
        fetch("https://router.project-osrm.org/route/v1/driving/"+c+"?overview=false&steps=false").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(data){
            if(data.code!=="Ok")throw new Error(data.code);
            data.routes[0].legs.forEach(function(leg){allLegs.push({mi:Math.round(leg.distance*0.000621371*10)/10,mins:Math.round(leg.duration/60)})});
            bi++;setTimeout(nb,200);
        }).catch(function(err){
            console.error("OSRM batch "+bi,err);var b2=batches[bi];
            for(var j=0;j<b2.length-1;j++){var a=b2[j],b=b2[j+1];var dlat=(b[1]-a[1])*Math.PI/180,dlon=(b[0]-a[0])*Math.PI/180;var x=Math.sin(dlat/2)*Math.sin(dlat/2)+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dlon/2)*Math.sin(dlon/2);var mi=3959*2*Math.asin(Math.sqrt(x))*1.4;allLegs.push({mi:Math.round(mi*10)/10,mins:Math.round(mi/45*60)})}
            bi++;setTimeout(nb,200);
        });
    }
    nb();
}

function googleLegs(points,callback){
    // points = [[lon,lat],...] - chunk into requests of max 25 points
    var allLegs=[];
    if(points.length<2){callback(allLegs);return}
    var chunkSize=25;
    var chunks=[];
    for(var i=0;i<points.length;i+=chunkSize-1){
        var end=Math.min(i+chunkSize,points.length);
        chunks.push(points.slice(i,end));
        if(end>=points.length)break;
    }
    var ci=0;
    function nc(){
        if(ci>=chunks.length){callback(allLegs);return}
        var chunk=chunks[ci];
        statusEl.textContent="Google drive times... batch "+(ci+1)+"/"+chunks.length;
        var origin={lat:chunk[0][1],lng:chunk[0][0]};
        var dest={lat:chunk[chunk.length-1][1],lng:chunk[chunk.length-1][0]};
        var wps=chunk.slice(1,-1).map(function(p){return{location:{lat:p[1],lng:p[0]},stopover:true}});
        gDirSvc.route({origin:origin,destination:dest,waypoints:wps,travelMode:google.maps.TravelMode.DRIVING},function(res,status){
            if(status==="OK"&&res.routes.length){
                res.routes[0].legs.forEach(function(leg){
                    allLegs.push({mi:Math.round(leg.distance.value*0.000621371*10)/10,mins:Math.round(leg.duration.value/60)});
                });
                ci++;setTimeout(nc,300);
            } else {
                console.error("Google Directions status:",status,"- falling back to OSRM for this chunk");
                // OSRM fallback for this chunk
                var c=chunk.map(function(p){return p[0]+","+p[1]}).join(";");
                fetch("https://router.project-osrm.org/route/v1/driving/"+c+"?overview=false&steps=false").then(function(r){return r.json()}).then(function(data){
                    if(data.code==="Ok"){data.routes[0].legs.forEach(function(leg){allLegs.push({mi:Math.round(leg.distance*0.000621371*10)/10,mins:Math.round(leg.duration/60)})})}
                    else{for(var j=0;j<chunk.length-1;j++)allLegs.push({mi:0,mins:15})}
                    ci++;setTimeout(nc,300);
                }).catch(function(){for(var j=0;j<chunk.length-1;j++)allLegs.push({mi:0,mins:15});ci++;setTimeout(nc,300)});
            }
        });
    }
    nc();
}

function getLegs(points,callback){
    if(gmapsReady&&gDirSvc)googleLegs(points,callback);
    else osrmLegs(points,callback);
}

// Route geometry per day: Google overview_path if available, else OSRM
function getDayGeometry(sts,callback){
    if(gmapsReady&&gDirSvc&&sts.length>=2&&sts.length<=25){
        var origin={lat:sts[0].s[3],lng:sts[0].s[4]};
        var dest={lat:sts[sts.length-1].s[3],lng:sts[sts.length-1].s[4]};
        var wps=sts.slice(1,-1).map(function(st){return{location:{lat:st.s[3],lng:st.s[4]},stopover:true}});
        gDirSvc.route({origin:origin,destination:dest,waypoints:wps,travelMode:google.maps.TravelMode.DRIVING},function(res,status){
            if(status==="OK"&&res.routes.length){
                callback(res.routes[0].overview_path.map(function(p){return[p.lat(),p.lng()]}));
            } else callback(null);
        });
        return;
    }
    // OSRM
    var c=sts.map(function(st){return st.s[4]+","+st.s[3]}).join(";");
    fetch("https://router.project-osrm.org/route/v1/driving/"+c+"?overview=full&geometries=geojson&steps=false").then(function(r){return r.json()}).then(function(data){
        if(data.code==="Ok")callback(data.routes[0].geometry.coordinates.map(function(c){return[c[1],c[0]]}));
        else callback(null);
    }).catch(function(){callback(null)});
}

// ============================================================
// CUT DAYS: arrive by cutoff, cap per week, skip weekends
// ============================================================
function cutDays(remaining,legs,startDate,startMin,hasGPS){
    var days=[],curDate=startDate,clock=startMin,curStores=[];
    var maxArrival=parseInt(document.getElementById("cutoff").value);
    var maxWeek=parseInt(document.getElementById("maxpw").value);
    var weekCounts={};
    var legOff=hasGPS?1:0;

    function wk(d){return mondayOf(d)}
    function advanceDay(){
        if(curStores.length>0){days.push({date:curDate,label:dateLbl(curDate),stores:curStores.slice()});curStores=[]}
        curDate=nextWeekday(curDate);clock=7*60;
    }
    function advanceWeek(){
        if(curStores.length>0){days.push({date:curDate,label:dateLbl(curDate),stores:curStores.slice()});curStores=[]}
        curDate=nextMonday(curDate);clock=7*60;
    }

    for(var i=0;i<remaining.length;i++){
        // Weekly cap check
        var wkKey=wk(curDate);
        if((weekCounts[wkKey]||0)>=maxWeek){advanceWeek();wkKey=wk(curDate)}

        var dm=0,dmi=0;
        if(i===0&&hasGPS){dm=legs[0].mins;dmi=legs[0].mi}
        else if(curStores.length>0){var li=i-1+legOff;if(li<legs.length){dm=legs[li].mins;dmi=legs[li].mi}}

        var arrival=clock+dm;
        if(arrival>maxArrival&&curStores.length>0){
            advanceDay();
            // Recheck weekly cap after day advance
            wkKey=wk(curDate);
            if((weekCounts[wkKey]||0)>=maxWeek){advanceWeek();wkKey=wk(curDate)}
            arrival=clock;dm=0;dmi=0;
        }

        curStores.push({s:remaining[i],arrival:arrival,driveMin:dm,mi:dmi});
        weekCounts[wkKey]=(weekCounts[wkKey]||0)+1;
        clock=arrival+30;
    }
    if(curStores.length>0)days.push({date:curDate,label:dateLbl(curDate),stores:curStores.slice()});
    return days;
}

function clearRoutes(){routeLayers.forEach(function(l){map.removeLayer(l)});routeLayers=[]}

function drawDays(days,callback){
    curDays=days;clearRoutes();legD={};ovnD={};
    Object.keys(mkrs).forEach(function(sid){var m=mkrs[sid];m.dayIdx=-1;m.idx=0;m.tot=0;m.col="#aaa";if(!comp[sid])m.mk.setStyle({fillColor:"#aaa",color:"#fff",fillOpacity:0.6})});
    days.forEach(function(day,di){
        var col=colors[di%colors.length];
        day.stores.forEach(function(st,si){
            var sid=st.s[0];legD[sid]={arrival:ft(st.arrival),departure:ft(st.arrival+30),minutes:st.driveMin,miles:st.mi};
            var m=mkrs[sid];if(m){m.dayIdx=di;m.idx=si;m.tot=day.stores.length;m.col=col;if(!comp[sid])m.mk.setStyle({fillColor:col,color:"#fff",fillOpacity:0.9})}
        });
    });
    for(var i=0;i<days.length-1;i++){if(days[i].tripIdx!==undefined&&days[i].tripIdx!==days[i+1].tripIdx)continue;var ls=days[i].stores[days[i].stores.length-1],fs=days[i+1].stores[0];ovnD[ls.s[0]]={to:fs.s[2],dt:"...",mi:"..."};ovnD["f_"+fs.s[0]]={fr:ls.s[2],dt:"...",mi:"...",type:"Overnight"}}
    var di=0;
    function ndr(){
        if(di>=days.length){fetchOvn(days,function(){injectAirportOvn();statusEl.style.display="none";document.getElementById("xbtn").style.display="block";showLegend();buildLeg(days);saveRouteLS();routingDone();if(callback)callback()});return}
        var day=days[di],sts=day.stores;
        if(sts.length<2){routeLayers.push(L.layerGroup().addTo(map));di++;setTimeout(ndr,100);return}
        var col=colors[di%colors.length];
        statusEl.textContent="Drawing route "+(di+1)+"/"+days.length+"...";
        getDayGeometry(sts,function(geom){
            if(geom)routeLayers.push(L.polyline(geom,{color:col,weight:3.5,opacity:0.7}).addTo(map));
            else routeLayers.push(L.polyline(sts.map(function(st){return[st.s[3],st.s[4]]}),{color:col,weight:2,opacity:0.4,dashArray:"4,6"}).addTo(map));
            di++;setTimeout(ndr,300);
        });
    }
    ndr();
}

function fetchOvn(days,callback){
    var pairs=[];for(var i=0;i<days.length-1;i++){if(days[i].tripIdx!==undefined&&days[i].tripIdx!==days[i+1].tripIdx)continue;var ls=days[i].stores[days[i].stores.length-1],fs=days[i+1].stores[0];pairs.push({fs:ls.s[0],fc:ls.s[2],flat:ls.s[3],flon:ls.s[4],ts:fs.s[0],tc:fs.s[2],tlat:fs.s[3],tlon:fs.s[4]})}
    var pi=0;
    function next(){if(pi>=pairs.length){callback();return}var p=pairs[pi];
        fetch("https://router.project-osrm.org/route/v1/driving/"+p.flon+","+p.flat+";"+p.tlon+","+p.tlat+"?overview=false").then(function(r){return r.json()}).then(function(data){if(data.code==="Ok"){var rt=data.routes[0],mi=Math.round(rt.distance*0.000621371*10)/10,mins=Math.round(rt.duration/60),h=Math.floor(mins/60),m=mins%60,dt=h>0?h+"hr "+m+"min":m+"min";ovnD[p.fs]={to:p.tc,dt:dt,mi:mi};ovnD["f_"+p.ts]={fr:p.fc,dt:dt,mi:mi,type:"Overnight"}}pi++;setTimeout(next,150)}).catch(function(){pi++;setTimeout(next,150)});
    }

}

}

function optimizeLoop(stores,aptLat,aptLon){
    // Nearest neighbor from airport
    var un=stores.slice(),order=[];
    var cl=aptLat,co=aptLon;
    while(un.length){
        var bi=0,bd=1e9;
        for(var i=0;i<un.length;i++){var d=hv(cl,co,un[i][3],un[i][4]);if(d<bd){bd=d;bi=i}}

        var any=false;
        for(var i=0;i<order.length-1;i++){

document.getElementById("tripBtn").addEventListener("click",function(){
    if(routing)return;
    if(curDays.length===0){alert("Route something first.");return}
    var sels=document.querySelectorAll(".wkTrip");
    var groups={};
    sels.forEach(function(s){
        var t=s.value,wk=s.getAttribute("data-wk");
        if(!groups[t])groups[t]=[];
        groups[t].push(wk);
    });
    var tripNums=Object.keys(groups).sort(function(a,b){return a-b});
    var trips=[];
    tripNums.forEach(function(t){
        var wks=groups[t];
        var stores=[];
        curDays.forEach(function(day){
            if(wks.indexOf(mondayOf(day.date))<0)return;
            day.stores.forEach(function(st){if(!comp[st.s[0]])stores.push(st.s)});
        });
        if(stores.length===0)return;
        wks.sort();
        trips.push({weeks:wks,startDate:wks[0],stores:stores});
    });

    routing=true;
    var tb=document.getElementById("tripBtn");tb.disabled=true;tb.style.opacity="0.5";
    statusEl.style.display="block";

            points.push([apOut.lon,apOut.lat]);
            getLegs(points,function(legs){
                var retLeg=legs.length>=ordered.length+1?legs[legs.length-1]:{mi:0,mins:0};
                var tripDays=cutDays(ordered,legs,trip.startDate,7*60,true);
                var tIdx=meta.length;
                tripDays.forEach(function(d){d.tripIdx=tIdx});
                allDays=allDays.concat(tripDays);
                meta.push({label:"Trip "+(tIdx+1),oneWay:true,airport:apIn,airportOut:apOut,regional:null,storeCount:ordered.length,startDate:trip.startDate,inLeg:legs.length>0?legs[0]:{mi:0,mins:0},retLeg:retLeg,firstSid:ordered[0][0],lastSid:ordered[ordered.length-1][0]});
                ti++;setTimeout(nextTrip,300);
            });
        }
    }
    nextTrip();
});

function injectAirportOvn(){
    if(!window.tripsMeta)return;
    window.tripsMeta.forEach(function(t){
        var h=Math.floor(t.inLeg.mins/60),m=t.inLeg.mins%60;
        var dtIn=h>0?h+"hr "+m+"min":m+"min";
        ovnD["f_"+t.firstSid]={fr:t.airport.code+" airport",dt:dtIn,mi:t.inLeg.mi,type:"Drive"};
        var h2=Math.floor(t.retLeg.mins/60),m2=t.retLeg.mins%60;
        var dtOut=h2>0?h2+"hr "+m2+"min":m2+"min";
        ovnD[t.lastSid]={to:(t.airportOut?t.airportOut.code:t.airport.code)+" airport",dt:dtOut,mi:t.retLeg.mi};
    });
}

var routing=false;
function routingDone(){routing=false;var rb=document.getElementById("rbtn");rb.disabled=false;rb.style.opacity="1"}
function doRecalc(startDate,startMin,fromLat,fromLon){
    if(routing)return;
    window.tripsMeta=null;
    routing=true;
    var rb=document.getElementById("rbtn");rb.disabled=true;rb.style.opacity="0.5";
    statusEl.style.display="block";statusEl.textContent="Calculating...";document.getElementById("xbtn").style.display="none";
    var remaining=allStores.filter(function(s){return !comp[s[0]]});
    if(remaining.length===0){statusEl.textContent="All locations completed!";setTimeout(function(){statusEl.style.display="none"},2000);curDays=[];clearRoutes();buildLeg([]);routingDone();return}
    var preserve=document.getElementById("preserveOrder").checked;
    if(!preserve){
        statusEl.textContent="Optimizing store order...";
        var sLat=(fromLat!==null)?fromLat:null,sLon=(fromLon!==null)?fromLon:null;
        remaining=optimizePath(remaining,sLat,sLon,null,null);
    }
    var hasGPS=false,points;
    if(fromLat!==null&&fromLon!==null){hasGPS=true;points=[[fromLon,fromLat]];remaining.forEach(function(s){points.push([s[4],s[3]])})}
    else points=remaining.map(function(s){return[s[4],s[3]]});
    getLegs(points,function(legs){var days=cutDays(remaining,legs,startDate,startMin,hasGPS);statusEl.textContent="Drawing routes...";drawDays(days)});
}

document.getElementById("rbtn").addEventListener("click",function(){
    // Re-parse from column mapping if fresh upload
    if(parsedRows.length>0){
        var ci={sid:parseInt(document.getElementById("cSid").value),addr:parseInt(document.getElementById("cAddr").value),city:parseInt(document.getElementById("cCity").value),lat:parseInt(document.getElementById("cLat").value),lon:parseInt(document.getElementById("cLon").value)};
        if(ci.sid<0||ci.lat<0||ci.lon<0){alert("Map Store ID, Latitude, and Longitude columns");return}
        allStores=[];
        parsedRows.forEach(function(r){
            var lat=parseFloat(r[ci.lat]),lon=parseFloat(r[ci.lon]);
            if(isNaN(lat)||isNaN(lon)||lat===0||lon===0)return;
            var sid=String(r[ci.sid]===null||r[ci.sid]===undefined?"":r[ci.sid]).trim();
            if(!sid)return;
            allStores.push([sid,ci.addr>=0?String(r[ci.addr]||"").trim():"",ci.city>=0?String(r[ci.city]||"").trim():"",lat,lon]);
        });
        if(allStores.length===0){alert("No valid locations. Check column mapping.");return}
        document.getElementById("finfo").textContent=allStores.length+" locations mapped";
        placePins();updInfo();
    }
    if(allStores.length===0){alert("Upload a file first.");return}
    var startDate,startMin,fromLat=null,fromLon=null;
    if(liveMode){
        if(userLat===null){alert("Waiting for GPS fix.");return}
        var now=new Date();startDate=now.toISOString().slice(0,10);startMin=now.getHours()*60+now.getMinutes();fromLat=userLat;fromLon=userLon;
    } else {
        startDate=document.getElementById("rdate").value;
        if(!startDate){alert("Pick a start date.");return}
        var tv=document.getElementById("rtime").value.split(":");startMin=parseInt(tv[0])*60+parseInt(tv[1]);
    }
    doRecalc(startDate,startMin,fromLat,fromLon);
});

// ============================================================
// SAVE / LOAD ROUTE FILES
// ============================================================
document.getElementById("sbtn").addEventListener("click",function(){
    if(curDays.length===0){alert("No route to save. Route something first.");return}
    var name=prompt("Route name:","413_Route_"+new Date().toISOString().slice(0,10));
    if(!name)return;
    var data={name:name,saved:new Date().toISOString(),version:APP_VERSION,allStores:allStores,curDays:curDays,legD:legD,ovnD:ovnD,comp:comp,tripsMeta:window.tripsMeta};
    var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replace(/[^a-z0-9_\-]/gi,"_")+".json";a.click();
});

document.getElementById("ldbtn").addEventListener("click",function(){document.getElementById("routeIn").click()});
document.getElementById("routeIn").addEventListener("change",function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
        try{
            var data=JSON.parse(ev.target.result);
            if(!data.allStores||!data.curDays){alert("Invalid route file.");return}
            allStores=data.allStores;curDays=data.curDays;legD=data.legD||{};ovnD=data.ovnD||{};window.tripsMeta=data.tripsMeta||null;
            if(data.comp){comp=data.comp;saveC()}
            clearUploadState();placePins();updInfo();restoreView();
            document.getElementById("finfo").style.display="block";
            document.getElementById("finfo").textContent=(data.name||"Route")+" loaded - "+allStores.length+" locations";
            document.getElementById("finfo").style.color="#3B79B4";
            document.getElementById("rbtn").style.display="block";
            saveRouteLS();
        }catch(err){alert("Could not read route file: "+err.message)}
    };
    reader.readAsText(file);
});

function clearUploadState(){
    parsedRows=[];parsedHeaders=[];
    document.getElementById("colMap").style.display="none";
    document.getElementById("fileIn").value="";
}
function restoreView(){
    Object.keys(mkrs).forEach(function(sid){var m=mkrs[sid];m.dayIdx=-1;m.idx=0;m.tot=0;m.col="#aaa";if(!comp[sid])m.mk.setStyle({fillColor:"#aaa",color:"#fff",fillOpacity:0.6})});
    curDays.forEach(function(day,di){var col=colors[di%colors.length];day.stores.forEach(function(st,si){var m=mkrs[st.s[0]];if(m){m.dayIdx=di;m.idx=si;m.tot=day.stores.length;m.col=col;if(!comp[st.s[0]])m.mk.setStyle({fillColor:col,color:"#fff",fillOpacity:0.9})}})});
    clearRoutes();
    statusEl.style.display="block";
    var rdi=0;
    function ds(){
        if(rdi>=curDays.length){statusEl.style.display="none";document.getElementById("xbtn").style.display="block";showLegend();buildLeg(curDays);return}
        var day=curDays[rdi],sts=day.stores;
        if(sts.length<2){routeLayers.push(L.layerGroup().addTo(map));rdi++;setTimeout(ds,50);return}
        var col=colors[rdi%colors.length];
        statusEl.textContent="Drawing route "+(rdi+1)+"/"+curDays.length+"...";
        getDayGeometry(sts,function(geom){
            if(geom)routeLayers.push(L.polyline(geom,{color:col,weight:3.5,opacity:0.7}).addTo(map));
            else routeLayers.push(L.polyline(sts.map(function(st){return[st.s[3],st.s[4]]}),{color:col,weight:2,opacity:0.4,dashArray:"4,6"}).addTo(map));
            rdi++;setTimeout(ds,250);
        });
    }
    ds();
}

// ============================================================
// EXPORT XLS
// ============================================================
document.getElementById("xbtn").addEventListener("click",function(){
    var data=[["Trip","Date","Store #","Address","City","Arrival","Departure","Drive Min","Road Miles","Status"]];
    curDays.forEach(function(day){
        var tripLbl=(day.tripIdx!==undefined&&window.tripsMeta&&window.tripsMeta[day.tripIdx])?window.tripsMeta[day.tripIdx].label+" ("+window.tripsMeta[day.tripIdx].airport.code+")":"";
        day.stores.forEach(function(st){
        var sid=st.s[0],ld=legD[sid]||{};
        data.push([tripLbl,day.label,sid,st.s[1],st.s[2],ld.arrival||"",ld.departure||"",ld.minutes!==undefined?ld.minutes:"",ld.miles!==undefined?ld.miles:"",comp[sid]?"COMPLETED":""]);
    })});
    var ws=XLSX.utils.aoa_to_sheet(data);
    ws["!cols"]=[{wch:14},{wch:12},{wch:10},{wch:35},{wch:20},{wch:12},{wch:12},{wch:10},{wch:10},{wch:12}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Route Schedule");
    XLSX.writeFile(wb,"413_Route_Schedule.xlsx");
});


// ============================================================
// FIREBASE CLOUD ROUTES
// ============================================================
var cloudStatEl=document.getElementById("cloudstat");
function setCloudStat(msg,color){cloudStatEl.textContent=msg;cloudStatEl.style.color=color||"#888"}

function refreshCloudList(){
    if(!window.sbReady){setCloudStat("Connecting to cloud...","#888");return}
    setCloudStat("Loading route list...","#888");
    window.sbListRoutes().then(function(list){
        var sel=document.getElementById("cloudSel");
        sel.innerHTML="<option value=''>-- select a saved route --</option>";
        list.sort(function(a,b){return (b.created_at||"").localeCompare(a.created_at||"")});
        list.forEach(function(r){
            var opt=document.createElement("option");
            opt.value=r.id;
            var dt=r.created_at?r.created_at.slice(0,10):"";
            var by=r.created_by_email?r.created_by_email.split("@")[0]:"";
            opt.textContent=r.name+(dt?" - "+dt:"")+(by?" ["+by+"]":"");
            sel.appendChild(opt);
        });
        setCloudStat(list.length+" cloud routes available","#4caf50");
    }).catch(function(err){
        console.error("Cloud list error:",err);
        setCloudStat("Cloud error: "+err.message,"#f44336");
    });
}


document.getElementById("csavebtn").addEventListener("click",function(){
    if(!window.sbReady){alert("Cloud not connected yet. Wait a moment and try again.");return}
    if(curDays.length===0){alert("No route to save. Route something first.");return}
    var name=prompt("Route name:","413_Route_"+new Date().toISOString().slice(0,10));
    if(!name)return;
    setCloudStat("Saving...","#888");
    var payload={version:APP_VERSION,allStores:allStores,curDays:curDays,legD:legD,ovnD:ovnD,comp:comp,tripsMeta:window.tripsMeta};
    window.sbSaveRoute(name,payload).then(function(id){
        setCloudStat("Saved to cloud","#4caf50");
        refreshCloudList();
    }).catch(function(err){
        console.error("Cloud save error:",err);
        setCloudStat("Save failed: "+err.message,"#f44336");
        alert("Cloud save failed: "+err.message);
    });
});

document.getElementById("cloadbtn").addEventListener("click",function(){
    var id=document.getElementById("cloudSel").value;
    if(!id){alert("Select a cloud route first.");return}
    if(!window.sbReady){alert("Cloud not connected yet.");return}
    setCloudStat("Loading route...","#888");
    window.sbLoadRoute(id).then(function(data){
        if(!data||!data.allStores||!data.curDays){alert("Invalid cloud route.");return}
        allStores=data.allStores;curDays=data.curDays;legD=data.legD||{};ovnD=data.ovnD||{};window.tripsMeta=data.tripsMeta||null;
        if(data.comp){comp=data.comp;saveC()}
        clearUploadState();placePins();updInfo();restoreView();saveRouteLS();
        document.getElementById("rbtn").style.display="block";
        setCloudStat("Route loaded","#4caf50");
    }).catch(function(err){
        console.error("Cloud load error:",err);
        setCloudStat("Load failed: "+err.message,"#f44336");
    });
});

document.getElementById("cdelbtn").addEventListener("click",function(){
    var sel=document.getElementById("cloudSel");
    var id=sel.value;
    if(!id){alert("Select a cloud route to delete.");return}
    var name=sel.options[sel.selectedIndex].textContent;
    if(!confirm("Delete '"+name+"' from the cloud? This affects all users."))return;
    setCloudStat("Deleting...","#888");
    window.sbDeleteRoute(id).then(function(){
        setCloudStat("Deleted","#4caf50");
        refreshCloudList();
    }).catch(function(err){
        console.error("Cloud delete error:",err);
        setCloudStat("Delete failed: "+err.message,"#f44336");
    });
});

// ============================================================
// CLEAR ROUTE
// ============================================================
document.getElementById("clrbtn").addEventListener("click",function(){
    if(!confirm("Clear the current route from view? (Cloud and file saves are not affected.)"))return;
    curDays=[];legD={};ovnD={};window.tripsMeta=null;updateTripUI([]);
    clearRoutes();
    Object.keys(mkrs).forEach(function(sid){
        var m=mkrs[sid];m.dayIdx=-1;m.idx=0;m.tot=0;m.col="#aaa";
        var d2=!!comp[sid];
        m.mk.setStyle({fillColor:d2?"#999":"#aaa",color:d2?"#666":"#fff",fillOpacity:d2?0.4:0.6});
    });
    document.getElementById("legend").style.display="none";
    document.getElementById("xbtn").style.display="none";
    try{localStorage.removeItem("413route")}catch(e){}
    statusEl.style.display="none";
    var fi=document.getElementById("finfo");if(allStores.length){fi.textContent=allStores.length+" locations loaded (not routed)";fi.style.color="#888"}
});

// ============================================================
// LOAD SAVED FROM LOCALSTORAGE
// ============================================================
var saved=loadRouteLS();
if(saved&&saved.allStores&&saved.allStores.length>0&&saved.curDays&&saved.curDays.length>0){
    allStores=saved.allStores;curDays=saved.curDays;legD=saved.legD||{};ovnD=saved.ovnD||{};window.tripsMeta=saved.tripsMeta||null;
    placePins();updInfo();
    document.getElementById("finfo").style.display="block";
    document.getElementById("finfo").textContent=allStores.length+" locations (saved session)";
    document.getElementById("finfo").style.color="#3B79B4";
    document.getElementById("rbtn").style.display="block";
    restoreView();
}
