<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/topbar.css"><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/vendor/supabase.js"></script>
<script src="/assets/auth.js"></script>
<title>413 Solution Tools</title></head>
<body>
<header id="topbar"></header>
<main class="wrap">
  <h1>Tools</h1>
  <p class="muted" id="hello"></p>
  <div class="grid" id="grid"></div>
</main>
<script>
Platform.ready.then(function(P){
  var esc=P.esc;
  document.getElementById('hello').textContent='Signed in as '+(P.name||P.user.email)+'.';
  P.loadTools().then(function(tools){
    var html=tools.filter(function(t){return P.toolRoles(t).indexOf(P.role)!==-1;}).map(function(t){
      var live=t.status==='live';
      var ext=t.external?' target="_blank" rel="noopener"':'';
      return '<a class="tool" href="'+esc(t.path)+'"'+ext+' data-id="'+esc(t.id)+'">'+
        '<div class="icon">'+esc(t.icon||'•')+'</div>'+
        '<div class="name">'+esc(t.name)+(t.external?' <span class="muted small">↗</span>':'')+'</div>'+
        '<div class="desc">'+esc(t.description)+'</div>'+
        '<span class="tag'+(live?' live':'')+'">'+(live?'Live':'Coming soon')+'</span></a>';
    });
    if(P.isAdmin()){
      html.push('<a class="tool" href="/admin.html" data-id="admin"><div class="icon">⚙️</div><div class="name">Admin</div><div class="desc">Add, disable and remove users. Reset passwords.</div><span class="tag live">'+(P.role==='owner'?'Owner':'Admin')+'</span></a>');
    }
    document.getElementById('grid').innerHTML=html.join('');
  });
});
</script>
</body></html>
